<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ollo Labs: locked</title><style>body{margin:0;background:#0e1117;color:#e6e9ef;font:15px/1.45 system-ui,sans-serif}.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid #263148}
.bar a{color:#8fb3ff;text-decoration:none}.bar label{color:#9fb0cc;display:flex;gap:6px;align-items:center}.bar select{background:#182031;color:#e6e9ef;border:1px solid #263148;border-radius:6px;padding:4px}
#lab{max-width:1200px;margin:0 auto}.res{color:#9fb0cc;font:12px ui-monospace,monospace;padding:6px 14px calc(10px + env(safe-area-inset-bottom))}
main{max-width:980px;margin:0 auto;padding:36px 18px}h2{margin:28px 0 6px}h3{margin:14px 0 8px;color:#9fb0cc;font-weight:600}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{display:block;background:#182031;border:1px solid #263148;border-radius:12px;padding:14px;color:inherit;text-decoration:none}.card:hover{border-color:#2b6cff}.card b{display:block}.card small{color:#9fb0cc}.tag{font-size:11px;border:1px solid #2b6cff;border-radius:999px;padding:1px 7px;margin-left:6px;color:#8fb3ff}
.muted{color:#9fb0cc}
.lock{max-width:340px;margin:12vh auto;padding:24px}.lock input,.lock button{width:100%;box-sizing:border-box;padding:10px;margin-top:10px;border-radius:8px;border:1px solid #263148;background:#0e1117;color:#e6e9ef;font-size:15px}
.lock button{background:#2b6cff;border:0;cursor:pointer;color:#fff}#e{color:#ff7b72;font-size:13px;min-height:18px;margin-top:8px}</style></head>
<body><form id="f" class="card lock"><b style="font-size:20px">🦉 Ollo Labs</b><small>Private preview. Enter the admin password.</small>
<input id="p" type="password" autocomplete="current-password" aria-label="Password" autofocus><button>Unlock</button><div id="e"></div></form>
<script>
(async () => {
const BASE = '/ollo-labs/', SK = 'ollo_lab_k1', te = new TextEncoder(), E = document.getElementById('e');
const ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0)), b64 = a => btoa(String.fromCharCode(...new Uint8Array(a)));
if (!('serviceWorker' in navigator)) { E.textContent = 'This browser cannot open the labs (no service worker support).'; return; }
await navigator.serviceWorker.register(BASE + 'ollo-sw.js', { scope: BASE }); const reg = await navigator.serviceWorker.ready;
const give = k => new Promise(r => { const c = new MessageChannel(); c.port1.onmessage = () => r(); reg.active.postMessage({ t: 'key', k }, [c.port2]); setTimeout(r, 1500); });
const go = () => { location.replace(location.pathname === BASE + '_lock/gate.html' ? BASE : location.href); };
const saved = sessionStorage.getItem(SK);
if (saved && !sessionStorage.getItem('ollo_lab_try')) { sessionStorage.setItem('ollo_lab_try', '1'); await give(saved); return go(); }
sessionStorage.removeItem('ollo_lab_try');
document.getElementById('f').onsubmit = async ev => { ev.preventDefault(); E.textContent = 'Checking…';
  try { const M = await (await fetch(BASE + '_lock/lock.json', { cache: 'no-store' })).json();
    const b = await crypto.subtle.importKey('raw', te.encode(document.getElementById('p').value), 'PBKDF2', false, ['deriveBits']);
    const raw = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: ub(M.salt), iterations: M.iter }, b, 256);
    const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(M.check.iv), additionalData: te.encode('_check') }, k, ub(M.check.ct));
    const s = b64(raw); sessionStorage.setItem(SK, s); await give(s); sessionStorage.setItem('ollo_lab_try', '1'); go();
  } catch (e) { E.textContent = 'Wrong password.'; } };
})();
</script></body></html>
